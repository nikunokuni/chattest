<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>たからさがし</title>
  <style>
    /* ===== ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 0;
      min-height: 100dvh;
    }
    #app {
      width: 100%;
      max-width: 400px;
      background: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== 画面切り替え ===== */
    .screen { display: none; flex-direction: column; flex: 1; padding: 20px 16px; }
    .screen.active { display: flex; }

    /* ===== 共通 ===== */
    h2 { font-size: 1.15rem; font-weight: bold; margin-bottom: 16px; }
    .form-label { font-size: 0.85rem; color: #555; margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; margin-bottom: 14px;
      outline: none;
    }
    .form-input:focus { border-color: #e8860a; }
    .form-error { display: none; color: #c0392b; font-size: 0.8rem; margin-top: -10px; margin-bottom: 10px; }
    .form-error.show { display: block; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: #e8860a; color: white;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary {
      width: 100%; padding: 11px;
      background: transparent; color: #888;
      border: 1.5px solid #ddd; border-radius: 12px;
      font-size: 0.9rem; cursor: pointer;
      margin-bottom: 8px;
    }

    /* ===== オンボード：年齢・タイプ選択 ===== */
    .age-cards, .type-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .sel-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border: 2px solid #eee; border-radius: 12px;
      cursor: pointer; background: #fafafa;
    }
    .sel-card.selected { border-color: #e8860a; background: #fff8ee; }
    .sel-card-icon { font-size: 1.5rem; }
    .sel-card-name { font-size: 0.95rem; font-weight: bold; }
    .sel-card-desc { font-size: 0.78rem; color: #888; }

    /* ===== オンボード：親の呼び方チップ ===== */
    .parent-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .parent-chip {
      padding: 8px 16px; border: 1.5px solid #ddd; border-radius: 20px;
      font-size: 0.9rem; cursor: pointer; background: #fafafa;
    }
    .parent-chip.selected { border-color: #e8860a; background: #fff8ee; color: #e8860a; font-weight: bold; }

    /* ===== ステップドット ===== */
    .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ddd; transition: background 0.2s;
    }
    .step-dot.active { background: #e8860a; width: 20px; border-radius: 4px; }
    .step-dot.done { background: #ffd166; }

    /* ===== お題入力 ===== */
    .odai-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; margin-bottom: 14px;
      resize: none; min-height: 80px;
      outline: none;
    }
    .odai-input:focus { border-color: #e8860a; }
    .odai-hint { font-size: 0.8rem; color: #aaa; margin-bottom: 14px; }
    .odai-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .odai-chip {
      padding: 6px 12px; background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 20px; font-size: 0.85rem; cursor: pointer;
    }
    .odai-chip:hover { background: #ffd166; }

    /* ===== レンズ選択 ===== */
    .lens-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .lens-card {
      display: flex; flex-direction: column; gap: 4px;
      padding: 14px; border: 2px solid #eee; border-radius: 14px;
      cursor: pointer; background: #fafafa;
    }
    .lens-card.selected { border-color: #e8860a; background: #fff8ee; }
    .lens-card-top { display: flex; align-items: center; gap: 8px; }
    .lens-icon { font-size: 1.3rem; }
    .lens-name { font-size: 1rem; font-weight: bold; }
    .lens-desc { font-size: 0.8rem; color: #888; padding-left: 4px; }
    .odai-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 20px; padding: 6px 14px;
      font-size: 0.95rem; font-weight: bold; margin-bottom: 16px;
    }

    /* ===== チャット ===== */
    .chat-header {
      padding: 12px 16px; background: #fff8ee;
      border-bottom: 1px solid #ffd166;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header-info { display: flex; align-items: center; gap: 6px; }
    .chat-header-emoji { font-size: 1.3rem; }
    .chat-header-name { font-size: 0.95rem; font-weight: bold; }
    .chat-header-lens {
      font-size: 0.78rem; background: #ffd166;
      border-radius: 10px; padding: 2px 8px;
    }
    .back-btn {
      font-size: 0.78rem; background: transparent; border: none;
      color: #888; cursor: pointer; padding: 4px 8px;
    }

    .phase-bar { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px 16px 6px; }
    .phase-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ddd;
    }
    .phase-dot.active { background: #e8860a; }
    .phase-dot.done { background: #ffd166; }
    .phase-line { width: 20px; height: 2px; background: #eee; }

    .speaker-row { display: flex; gap: 8px; padding: 8px 16px 4px; }
    .speaker-btn {
      flex: 1; padding: 8px; font-size: 0.85rem;
      border: 1.5px solid #ddd; border-radius: 10px;
      cursor: pointer; background: #fafafa; text-align: center;
    }
    .speaker-btn.active-child { border-color: #e8860a; background: #fff8ee; font-weight: bold; }
    .speaker-btn.active-parent { border-color: #0a9396; background: #e0f4f5; font-weight: bold; }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble-ai { display: flex; gap: 8px; align-items: flex-start; }
    .ai-avatar { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .bubble-ai-text {
      background: #f0f0f0; border-radius: 0 14px 14px 14px;
      padding: 10px 14px; font-size: 0.95rem; line-height: 1.6;
      max-width: 78%;
    }
    .bubble-child { display: flex; justify-content: flex-end; }
    .bubble-child-text {
      background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 14px 0 14px 14px;
      padding: 10px 14px; font-size: 0.95rem; max-width: 78%;
    }
    .bubble-parent-wrap { display: flex; flex-direction: column; align-items: flex-end; }
    .bubble-parent-who { font-size: 0.75rem; color: #0a9396; margin-bottom: 2px; }
    .bubble-parent-text {
      background: #e0f4f5; border: 1.5px solid #94d2bd;
      border-radius: 14px 0 14px 14px;
      padding: 10px 14px; font-size: 0.95rem; max-width: 78%;
    }
    .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%; background: #aaa;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .chat-error-row {
      font-size: 0.85rem; color: #c0392b; display: flex; align-items: center; gap: 8px;
    }
    .retry-btn {
      padding: 4px 10px; background: #c0392b; color: white;
      border: none; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
    }

    .chat-input-wrap { padding: 8px 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
    .chat-input {
      flex: 1; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 0.95rem; outline: none;
    }
    .chat-input:focus { border-color: #e8860a; }
    .chat-send {
      padding: 10px 14px; background: #e8860a; color: white;
      border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
    }
    .chat-send:disabled { background: #ccc; cursor: not-allowed; }

    .finish-btn {
      margin: 8px 12px; padding: 13px;
      background: #0a9396; color: white;
      border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer;
    }

    /* ===== サマリー ===== */
    .summary-hero {
      text-align: center; padding: 20px 0 12px;
    }
    .summary-hero-emoji { font-size: 3rem; display: block; margin-bottom: 6px; }
    .summary-hero-ttl { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
    .summary-hero-sub { font-size: 0.85rem; color: #888; }

    .findings-card {
      background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
      position: relative;
    }
    .findings-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
    .finding-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .finding-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .finding-text { font-size: 0.95rem; line-height: 1.5; }

    .ai-opinion-card {
      background: #f0f4f5; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .ai-opinion-toggle {
      display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .ai-opinion-label { font-size: 0.85rem; font-weight: bold; }
    .ai-opinion-body { margin-top: 10px; font-size: 0.9rem; line-height: 1.7; color: #333; }
    .ai-opinion-para { margin-bottom: 8px; }

    .tomorrow-card {
      background: #e0f7ee; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .tomorrow-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
    .tomorrow-text { font-size: 0.9rem; line-height: 1.6; }
    .tomorrow-loading { font-size: 0.82rem; color: #888; display: flex; gap: 6px; align-items: center; }

    .note-card { background: #fafafa; border: 1.5px solid #eee; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .note-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
    .note-textarea {
      width: 100%; min-height: 80px; padding: 8px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 0.9rem; resize: none; outline: none;
      margin-bottom: 8px;
    }
    .note-save-btn {
      padding: 8px 16px; background: #e8860a; color: white;
      border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    }

    .summary-action-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .summary-action-btn {
      flex: 1; padding: 10px 4px; border: none; border-radius: 12px;
      font-size: 0.78rem; cursor: pointer; display: flex;
      flex-direction: column; align-items: center; gap: 4px;
    }
    .summary-action-again { background: #fff8ee; color: #e8860a; }
    .summary-action-next  { background: #e0f4f5; color: #0a9396; }

    /* ===== ローディングスピナー ===== */
    .spinner {
      width: 16px; height: 16px; border: 2px solid #ddd;
      border-top-color: #e8860a; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 共通エラー ===== */
    .err-banner {
      background: #fdecea; border: 1px solid #e74c3c; border-radius: 8px;
      padding: 10px 12px; font-size: 0.85rem; color: #c0392b;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="screen-root"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   constants
   ═══════════════════════════════════════════════════════ */
const PARENT_OPTS = ['パパ','ママ','きょうだい','ともだち','ひとり','そのた'];

const TYPES = [
  { id:'A', icon:'👀', name:'はっけん',   desc:'じっくりかんさつする。「あ、これみて！」' },
  { id:'B', icon:'📚', name:'しらべる',   desc:'ただしいちしきがすき。「ほんとうはなに？」' },
  { id:'C', icon:'🔭', name:'そうぞう',   desc:'みえないぶぶんをすいりする。「もしかして〜かな？」' },
];

const AGE_PROMPTS = [
  { id:'young',  label:'3〜5さい',  icon:'🐣', desc:'ひらがな・みじかいぶん' },
  { id:'middle', label:'6〜8さい',  icon:'🌱', desc:'すこしふくざつなといかけ' },
  { id:'older',  label:'9〜12さい', icon:'🌳', desc:'ふかくかんがえてみる' },
];

const LENSES = [
  { id:'ことば',   icon:'📖', name:'ことば',
    kidDesc:'どんなことばでいえるかな？ ことばあそびもしよう！' },
  { id:'かず',     icon:'🔢', name:'かず',
    kidDesc:'かずや かたち・おおきさを くらべてみよう！' },
  { id:'かがく',   icon:'🔬', name:'かがく',
    kidDesc:'なんで？どうして？を いっしょに かんがえよう！' },
  { id:'しゃかい', icon:'🗺', name:'しゃかい',
    kidDesc:'だれが つくったの？どこから きたの？' },
  { id:'じぶん',   icon:'💛', name:'じぶん',
    kidDesc:'きみはどう おもった？ すき？きらい？なんで？' },
];

const ODAI_SAMPLES = [
  {emoji:'☁️',name:'くも'},
  {emoji:'💧',name:'みず'},
  {emoji:'🌈',name:'にじ'},
  {emoji:'🐜',name:'あり'},
  {emoji:'🌳',name:'き'},
  {emoji:'🚦',name:'しんごう'},
  {emoji:'🍎',name:'りんご'},
  {emoji:'💡',name:'でんきゅう'},
  {emoji:'🤲',name:'て'},
  {emoji:'✏️',name:'えんぴつ'},
];

/* ═══════════════════════════════════════════════════════
   state
   ═══════════════════════════════════════════════════════ */
const S = {
  step: 0,
  user: { name:'たろう', type:'A', ageGroup:'middle', likes:'ポケモン', strengths:'', parentName:'ママ' },
  flow: 'odai',  // 'odai' | 'lens' | 'chat' | 'summary'
  odai: null,
  lens: null,
  lastLens: null,
  messages: [],
  speaker: 'child',
  isLoading: false,
  lastError: false,
  lastSendPayload: null,
  summaryItems: [],
  summaryOpinion: '',
  opinionOpen: false,
  bookmarked: false,
  currentNote: '',
  tomorrowHint: '',
  chatPhase: 1,
};

/* ═══════════════════════════════════════════════════════
   common
   ═══════════════════════════════════════════════════════ */
function esc(str) {
  if (typeof str !== 'string') return '';
  return str
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function aiText(str) {
  return esc(str).replace(/\n/g,'<br>');
}
const $id = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════
   ai — callAI
   ═══════════════════════════════════════════════════════ */
async function callAI(messages, system) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, system }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'API error');
  return data.text;
}

/* ═══════════════════════════════════════════════════════
   view — オンボーディング
   ═══════════════════════════════════════════════════════ */
function renderOnboard() {
  const s = S.step;
  const u = S.user;
  const dots = [0,1,2,3].map(i =>
    `<div class="step-dot ${i < s ? 'done' : i === s ? 'active' : ''}"></div>`
  ).join('');

  let body = '';
  if (s === 0) {
    body = `
      <div class="form-label">お子さんの <strong>よびかた</strong></div>
      <input class="form-input" id="ob-name" placeholder="れい：はるくん" value="${esc(u.name)}">
      <div class="form-error" id="ob-name-err">なまえをいれてください</div>
      <div class="form-label">すきなもの（じゆうに）</div>
      <input class="form-input" id="ob-likes" placeholder="ポケモン・サッカー…" value="${esc(u.likes)}">
      <div class="form-label" style="margin-top:4px"><strong>ねんれい</strong>をえらんでね</div>
      <div class="age-cards">
        ${AGE_PROMPTS.map(a => `
          <div class="sel-card ${u.ageGroup === a.id ? 'selected' : ''}" onclick="App.setAge('${a.id}')">
            <span class="sel-card-icon">${a.icon}</span>
            <div><div class="sel-card-name">${a.label}</div><div class="sel-card-desc">${a.desc}</div></div>
          </div>`).join('')}
      </div>`;
  } else if (s === 1) {
    body = `
      <div class="form-label"><strong>まなびのタイプ</strong>をえらんでね</div>
      <div class="type-cards">
        ${TYPES.map(t => `
          <div class="sel-card ${u.type === t.id ? 'selected' : ''}" onclick="App.setType('${t.id}')">
            <span class="sel-card-icon">${t.icon}</span>
            <div><div class="sel-card-name">${t.name}</div><div class="sel-card-desc">${t.desc}</div></div>
          </div>`).join('')}
      </div>`;
  } else if (s === 2) {
    body = `
      <div class="form-label"><strong>いっしょにするひと</strong>のよびかた</div>
      <div class="parent-chips">
        ${PARENT_OPTS.map(p => `
          <div class="parent-chip ${u.parentName === p ? 'selected' : ''}" onclick="App.setParent('${esc(p)}')">${esc(p)}</div>`).join('')}
      </div>`;
  }

  return `
    <div style="padding:20px 16px;display:flex;flex-direction:column;flex:1">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:2.5rem;margin-bottom:8px">🔍</div>
        <div style="font-size:1.3rem;font-weight:bold;margin-bottom:4px">たから<em>さがし</em></div>
        <div style="font-size:0.8rem;color:#888">まいにちのふとした きづきが、まなびのたからになる</div>
      </div>
      <div class="step-dots">${dots}</div>
      ${body}
      <div style="margin-top:auto;padding-top:16px">
        <button class="btn-primary" onclick="App.obNext()">
          ${s < 2 ? 'つぎへ ›' : 'はじめる 🔍'}
        </button>
        ${s > 0 ? `<button class="btn-secondary" onclick="App.obBack()">← もどる</button>` : ''}
      </div>
    </div>`;
}

/* ── view: お題入力 ── */
function renderOdai() {
  const u = S.user;
  const sampleChips = ODAI_SAMPLES.map(o => `
    <div class="odai-chip" onclick="App.selectOdaiSample(${JSON.stringify(JSON.stringify(o))})">${o.emoji} ${esc(o.name)}</div>
  `).join('');
  return `
    <div style="padding:20px 16px;display:flex;flex-direction:column;flex:1">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:2rem;margin-bottom:4px">🔍</div>
        <div style="font-size:1.2rem;font-weight:bold">たから<em>さがし</em></div>
      </div>

      <div style="background:#fff8ee;border:1.5px solid #ffd166;border-radius:14px;padding:12px;margin-bottom:16px">
        <div style="font-size:0.82rem;font-weight:bold;color:#e8860a;margin-bottom:10px">⚙️ せってい</div>

        <div class="form-label" style="margin-bottom:6px">ねんれい</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
          ${AGE_PROMPTS.map(a => `
            <div class="sel-card ${u.ageGroup === a.id ? 'selected' : ''}" onclick="App.setAge('${a.id}')" style="padding:8px 10px">
              <span class="sel-card-icon" style="font-size:1.2rem">${a.icon}</span>
              <div><div class="sel-card-name" style="font-size:0.85rem">${a.label}</div></div>
            </div>`).join('')}
        </div>

        <div class="form-label">すきなもの</div>
        <input class="form-input" id="likes-input" placeholder="ポケモン・サッカー…" value="${esc(u.likes)}" oninput="App.updateLikes(this.value)" style="margin-bottom:0">
      </div>

      <h2 style="font-size:1rem;margin-bottom:8px">📝 きょうのたからをきめよう</h2>
      <div class="form-label">気になるものや、さいきん見つけたものは？</div>
      <input class="form-input" id="odai-input" placeholder="れい：あり、くも、でんしゃ…">
      <div id="odai-error" class="form-error"></div>
      <div class="odai-hint">↓ サンプルからえらんでもOK</div>
      <div class="odai-list">${sampleChips}</div>
      <div style="margin-top:auto;padding-top:16px">
        <button class="btn-primary" onclick="App.submitOdai()">レンズをえらぶ ›</button>
      </div>
    </div>`;
}

/* ── view: レンズ選択 ── */
function renderLens() {
  return `
    <div style="padding:20px 16px;display:flex;flex-direction:column;flex:1">
      <div class="odai-pill">
        <span>${esc(S.odai?.emoji || '')}</span>
        <span>${esc(S.odai?.name || '')}</span>
      </div>
      <div style="font-size:0.85rem;color:#888;margin-bottom:14px">どのレンズでみてみる？ひとつだけえらんでね 🔍</div>
      <div class="lens-grid">
        ${LENSES.map(l => `
          <div class="lens-card ${S.lens === l.id ? 'selected' : ''}" onclick="App.selectLens('${l.id}')">
            <div class="lens-card-top">
              <span class="lens-icon">${l.icon}</span>
              <div class="lens-name">${esc(l.name)}</div>
            </div>
            <div class="lens-desc">${esc(l.kidDesc)}</div>
          </div>`).join('')}
      </div>
      <div style="margin-top:auto;padding-top:8px">
        <button class="btn-primary" onclick="App.startChat()" ${!S.lens ? 'disabled' : ''}>
          ${!S.lens ? 'レンズをえらんでね' : `${LENSES.find(l=>l.id===S.lens)?.icon} ${esc(S.lens)}レンズではじめる ›`}
        </button>
        <button class="btn-secondary" onclick="App.backToOdai()">← おだいにもどる</button>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   app — render・イベント
   ═══════════════════════════════════════════════════════ */
function render() {
  const root = $id('screen-root');
  root.style.display = 'flex';
  root.style.flexDirection = 'column';
  root.style.flex = '1';

  if (S.flow === 'odai') {
    root.innerHTML = renderOdai();
  } else if (S.flow === 'lens') {
    root.innerHTML = renderLens();
  } else if (S.flow === 'chat') {
    root.innerHTML = renderChat();
    bindChatEvents();
    scrollChat();
  } else if (S.flow === 'summary') {
    root.innerHTML = renderSummary();
  }
}

function bindChatEvents() {
  const ci = $id('chat-in');
  if (ci) {
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); App.sendChat(); }
    });
  }
}

function scrollChat() {
  setTimeout(() => {
    const el = $id('chat-area');
    if (el) el.scrollTop = el.scrollHeight;
  }, 80);
}

/* ═══════════════════════════════════════════════════════
   App — チャット以外の操作
   ═══════════════════════════════════════════════════════ */
const App = {

  /* ── オンボーディング ── */
  obNext() {
    const s = S.step;
    if (s === 0) {
      const name = $id('ob-name')?.value?.trim();
      if (!name) {
        $id('ob-name-err')?.classList.add('show');
        return;
      }
      S.user.name  = name;
      S.user.likes = $id('ob-likes')?.value?.trim() || '';
    }
    if (s < 2) {
      S.step++;
      render();
    } else {
      S.flow = 'odai';
      render();
    }
  },
  obBack() {
    if (S.step > 0) { S.step--; render(); }
  },
  setType(t)   { S.user.type      = t; render(); },
  setAge(a)    { S.user.ageGroup  = a; render(); },
  setParent(p) { S.user.parentName = p; render(); },
  updateLikes(v) { S.user.likes = v; },

  /* ── お題 ── */
  selectOdaiSample(jsonStr) {
    const o = JSON.parse(jsonStr);
    S.odai = o;
    S.lens = S.lastLens || null;
    S.flow = 'lens';
    render();
  },
  async submitOdai() {
    const txt = $id('odai-input')?.value?.trim();
    const errEl = $id('odai-error');
    if (!txt) {
      errEl.textContent = 'おだいをいれてください';
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    try {
      const res = await callAI(
        [{ role:'user', content:`子どもが「${txt}」と言いました。JSONのみ: {"name":"ひらがな短い単語","emoji":"絵文字","label":"カテゴリ"}` }],
        'JSONのみ返してください（Markdownなし）。'
      );
      S.odai = JSON.parse(res.replace(/```json|```/g, '').trim());
    } catch {
      S.odai = { emoji:'✨', name: txt.slice(0, 10), label:'きになること' };
    }
    S.lens = S.lastLens || null;
    S.flow = 'lens';
    render();
  },
  backToOdai() { S.flow = 'odai'; render(); },
  closeChatFlow() { S.flow = 'odai'; render(); },

  /* ── レンズ ── */
  selectLens(id) {
    S.lens = S.lens === id ? null : id;
    render();
  },

  /* ── チャット・サマリー操作はchat.jsのChatAppに委譲 ── */
  startChat()      { return ChatApp.startChat(); },
  setSpeaker(sp)   { return ChatApp.setSpeaker(sp); },
  sendChat()       { return ChatApp.sendChat(); },
  retryLastSend()  { return ChatApp.retryLastSend(); },
  goSummary()      { return ChatApp.goSummary(); },
  toggleOpinion()  { return ChatApp.toggleOpinion(); },
  saveNote()       { return ChatApp.saveNote(); },
  doAgain()        { return ChatApp.doAgain(); },
  nextOdai()       { return ChatApp.nextOdai(); },
};
</script>

<!-- チャット機能（chat.js）を読み込む -->
<script src="api/chat.js"></script>

<script>
/* ── 起動 ── */
render();
</script>
</body>
