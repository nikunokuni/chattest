<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>たからさがし — チャットテスト</title>
  <style>
    /* ===== ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 0;

    }
    #app {
      width: 100%;
      max-width: 400px;
      background: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== 画面切り替え ===== */
    .screen { display: none; flex-direction: column; flex: 1; padding: 20px 16px; }
    .screen.active { display: flex; }

    /* ===== 共通 ===== */
    h2 { font-size: 1.15rem; font-weight: bold; margin-bottom: 16px; }
    .form-label { font-size: 0.85rem; color: #555; margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; margin-bottom: 14px;
      outline: none;
    }
    .form-input:focus { border-color: #e8860a; }
    .form-error { display: none; color: #c0392b; font-size: 0.8rem; margin-top: -10px; margin-bottom: 10px; }
    .form-error.show { display: block; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: #e8860a; color: white;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary {
      width: 100%; padding: 11px;
      background: transparent; color: #888;
      border: 1.5px solid #ddd; border-radius: 12px;
      font-size: 0.9rem; cursor: pointer;
      margin-bottom: 8px;
    }

    /* ===== オンボード：年齢・タイプ選択 ===== */
    .age-cards, .type-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .sel-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border: 2px solid #eee; border-radius: 12px;
      cursor: pointer; background: #fafafa;
    }
    .sel-card.selected { border-color: #e8860a; background: #fff8ee; }
    .sel-card-icon { font-size: 1.5rem; }
    .sel-card-name { font-size: 0.95rem; font-weight: bold; }
    .sel-card-desc { font-size: 0.78rem; color: #888; }

    /* ===== オンボード：親の呼び方チップ ===== */
    .parent-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .parent-chip {
      padding: 8px 16px; border: 1.5px solid #ddd; border-radius: 20px;
      font-size: 0.9rem; cursor: pointer; background: #fafafa;
    }
    .parent-chip.selected { border-color: #e8860a; background: #fff8ee; color: #e8860a; font-weight: bold; }

    /* ===== ステップドット ===== */
    .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ddd; transition: background 0.2s;
    }
    .step-dot.active { background: #e8860a; width: 20px; border-radius: 4px; }
    .step-dot.done { background: #ffd166; }

    /* ===== お題入力 ===== */
    .odai-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; margin-bottom: 14px;
      resize: none; min-height: 80px;
      outline: none;
    }
    .odai-input:focus { border-color: #e8860a; }
    .odai-hint { font-size: 0.8rem; color: #aaa; margin-bottom: 14px; }
    .odai-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .odai-chip {
      padding: 6px 12px; background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 20px; font-size: 0.85rem; cursor: pointer;
    }
    .odai-chip:hover { background: #ffd166; }

    /* ===== レンズ選択 ===== */
    .lens-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .lens-card {
      display: flex; flex-direction: column; gap: 4px;
      padding: 14px; border: 2px solid #eee; border-radius: 14px;
      cursor: pointer; background: #fafafa;
    }
    .lens-card.selected { border-color: #e8860a; background: #fff8ee; }
    .lens-card-top { display: flex; align-items: center; gap: 8px; }
    .lens-icon { font-size: 1.3rem; }
    .lens-name { font-size: 1rem; font-weight: bold; }
    .lens-desc { font-size: 0.8rem; color: #888; padding-left: 4px; }
    .odai-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 20px; padding: 6px 14px;
      font-size: 0.95rem; font-weight: bold; margin-bottom: 16px;
    }

    /* ===== チャット ===== */
    .chat-header {
      padding: 12px 16px; background: #fff8ee;
      border-bottom: 1px solid #ffd166;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header-info { display: flex; align-items: center; gap: 6px; }
    .chat-header-emoji { font-size: 1.3rem; }
    .chat-header-name { font-size: 0.95rem; font-weight: bold; }
    .chat-header-lens {
      font-size: 0.78rem; background: #ffd166;
      border-radius: 10px; padding: 2px 8px;
    }
    .back-btn {
      font-size: 0.78rem; background: transparent; border: none;
      color: #888; cursor: pointer; padding: 4px 8px;
    }

    .phase-bar { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px 16px 6px; }
    .phase-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ddd;
    }
    .phase-dot.active { background: #e8860a; }
    .phase-dot.done { background: #ffd166; }
    .phase-line { width: 20px; height: 2px; background: #eee; }

    .speaker-row { display: flex; gap: 8px; padding: 8px 16px 4px; }
    .speaker-btn {
      flex: 1; padding: 8px; font-size: 0.85rem;
      border: 1.5px solid #ddd; border-radius: 10px;
      cursor: pointer; background: #fafafa; text-align: center;
    }
    .speaker-btn.active-child { border-color: #e8860a; background: #fff8ee; font-weight: bold; }
    .speaker-btn.active-parent { border-color: #0a9396; background: #e0f4f5; font-weight: bold; }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble-ai { display: flex; gap: 8px; align-items: flex-start; }
    .ai-avatar { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .bubble-ai-text {
      background: #f0f0f0; border-radius: 0 14px 14px 14px;
      padding: 10px 14px; font-size: 0.95rem; line-height: 1.6;
      max-width: 78%;
    }
    .bubble-child { display: flex; justify-content: flex-end; }
    .bubble-child-text {
      background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 14px 0 14px 14px;
      padding: 10px 14px; font-size: 0.95rem; max-width: 78%;
    }
    .bubble-parent-wrap { display: flex; flex-direction: column; align-items: flex-end; }
    .bubble-parent-who { font-size: 0.75rem; color: #0a9396; margin-bottom: 2px; }
    .bubble-parent-text {
      background: #e0f4f5; border: 1.5px solid #94d2bd;
      border-radius: 14px 0 14px 14px;
      padding: 10px 14px; font-size: 0.95rem; max-width: 78%;
    }
    .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%; background: #aaa;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .chat-error-row {
      font-size: 0.85rem; color: #c0392b; display: flex; align-items: center; gap: 8px;
    }
    .retry-btn {
      padding: 4px 10px; background: #c0392b; color: white;
      border: none; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
    }

    .chat-input-wrap { padding: 8px 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
    .chat-input {
      flex: 1; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 0.95rem; outline: none;
    }
    .chat-input:focus { border-color: #e8860a; }
    .chat-send {
      padding: 10px 14px; background: #e8860a; color: white;

    }
    .chat-send:disabled { background: #ccc; cursor: not-allowed; }

    .finish-btn {
      margin: 8px 12px; padding: 13px;
      background: #0a9396; color: white;
      border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer;
    }

    /* ===== サマリー ===== */
    .summary-hero {
      text-align: center; padding: 20px 0 12px;
    }
    .summary-hero-emoji { font-size: 3rem; display: block; margin-bottom: 6px; }
    .summary-hero-ttl { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
    .summary-hero-sub { font-size: 0.85rem; color: #888; }

    .findings-card {
      background: #fff8ee; border: 1.5px solid #ffd166;
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
      position: relative;
    }
    .findings-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
    .finding-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .finding-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .finding-text { font-size: 0.95rem; line-height: 1.5; }

    .ai-opinion-card {
      background: #f0f4f5; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .ai-opinion-toggle {
      display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .ai-opinion-label { font-size: 0.85rem; font-weight: bold; }
    .ai-opinion-body { margin-top: 10px; font-size: 0.9rem; line-height: 1.7; color: #333; }
    .ai-opinion-para { margin-bottom: 8px; }

    .tomorrow-card {
      background: #e0f7ee; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .tomorrow-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
    .tomorrow-text { font-size: 0.9rem; line-height: 1.6; }
    .tomorrow-loading { font-size: 0.82rem; color: #888; display: flex; gap: 6px; align-items: center; }

    .note-card { background: #fafafa; border: 1.5px solid #eee; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .note-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
    .note-textarea {
      width: 100%; min-height: 80px; padding: 8px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 0.9rem; resize: none; outline: none;
      margin-bottom: 8px;
    }
    .note-save-btn {
      padding: 8px 16px; background: #e8860a; color: white;
      border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    }

    .summary-action-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .summary-action-btn {
      flex: 1; padding: 10px 4px; border: none; border-radius: 12px;
      font-size: 0.78rem; cursor: pointer; display: flex;
      flex-direction: column; align-items: center; gap: 4px;
    }
    .summary-action-again { background: #fff8ee; color: #e8860a; }
    .summary-action-next  { background: #e0f4f5; color: #0a9396; }

    /* ===== ローディングスピナー ===== */
    .spinner {
      width: 16px; height: 16px; border: 2px solid #ddd;
      border-top-color: #e8860a; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 共通エラー ===== */
    .err-banner {
      background: #fdecea; border: 1px solid #e74c3c; border-radius: 8px;
      padding: 10px 12px; font-size: 0.85rem; color: #c0392b;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="screen-root"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   constants（抜粋）
   ═══════════════════════════════════════════════════════ */
const PARENT_OPTS = ['パパ','ママ','きょうだい','ともだち','ひとり','そのた'];


const AGE_PROMPTS = [
  { id:'young',  label:'3〜5さい',  icon:'🐣', desc:'ひらがな・みじかいぶん' },
  { id:'middle', label:'6〜8さい',  icon:'🌱', desc:'すこしふくざつなといかけ' },
  { id:'older',  label:'9〜12さい', icon:'🌳', desc:'ふかくかんがえてみる' },
];

const LENSES = [
  { id:'ことば',   icon:'📖', name:'ことば',
    kidDesc:'どんなことばでいえるかな？ ことばあそびもしよう！' },
  { id:'かず',     icon:'🔢', name:'かず',
    kidDesc:'かずや かたち・おおきさを くらべてみよう！' },
  { id:'かがく',   icon:'🔬', name:'かがく',
    kidDesc:'なんで？どうして？を いっしょに かんがえよう！' },
  { id:'しゃかい', icon:'🗺', name:'しゃかい',
    kidDesc:'だれが つくったの？どこから きたの？' },
  { id:'じぶん',   icon:'💛', name:'じぶん',
    kidDesc:'きみはどう おもった？ すき？きらい？なんで？' },
];

// ランダムお題サンプル
const ODAI_SAMPLES = [
  {emoji:'☁️',name:'くも'},
  {emoji:'💧',name:'みず'},
  {emoji:'🌈',name:'にじ'},
  {emoji:'🐜',name:'あり'},
  {emoji:'🌳',name:'き'},
  {emoji:'🚦',name:'しんごう'},
  {emoji:'🍎',name:'りんご'},
  {emoji:'💡',name:'でんきゅう'},
  {emoji:'🤲',name:'て'},
  {emoji:'✏️',name:'えんぴつ'},
];

/* ═══════════════════════════════════════════════════════
   state.js（テスト用簡易版）
   ═══════════════════════════════════════════════════════ */
const S = {
  step: 0,
  user: { name:'', ageGroup:'young', strengths:'', parentName:'ママ' },
  flow: 'onboard',  // 'onboard' | 'odai' | 'lens' | 'chat' | 'summary'
  odai: null,
  lens: null,
  lastLens: null,
  messages: [],
  speaker: 'child',
  isLoading: false,
  lastError: false,
  lastSendPayload: null,
  summaryItems: [],
  summaryOpinion: '',
  opinionOpen: false,
  bookmarked: false,
  currentNote: '',
  tomorrowHint: '',
  chatPhase: 1,
};

/* ═══════════════════════════════════════════════════════
   common.js
   ═══════════════════════════════════════════════════════ */
function esc(str) {
  if (typeof str !== 'string') return '';
  return str
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function aiText(str) {
  return esc(str).replace(/\n/g,'<br>');
}
const $id = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════
   ai.js（callAI のみ）
   ═══════════════════════════════════════════════════════ */
async function callAI(messages, system) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, system }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'API error');
  return data.text;
}

/* ── ai.js: フェーズ判定 ── */
function detectPhaseFromAI(text, userMsgCount) {
  const phase4signals = [
    'ひとことでいうと','まとめてみよう','たからをしまおう',
    'どういうものだと思う？','ひとことで','いちばんおもしろかった',
    'わかったことを','きょうのたから','下のボタン','📦',
  ];
  if (phase4signals.some(sig => text.includes(sig))) return 4;
  const phase3signals = ['なんで','どうして','なぜ','どうおもう','どう思う','かんがえてみて'];
  if (phase3signals.some(sig => text.includes(sig)) && userMsgCount >= 2) return 3;
  if (userMsgCount >= 4) return 3;
  if (userMsgCount >= 2) return 2;
  return null;
}

/* ── ai.js: chatSystem ── */
function chatSystem() {
  const u = S.user;
  const userMsgCount = S.messages.filter(m => m.role !== 'ai').length;
  const parentDue    = userMsgCount > 0 && userMsgCount % 4 === 0;

  const baseLayer = `あなたは「たからちゃん」です。
子どもが日常で見つけたものについて、一緒に「子どもなりの答え」を作る案内役です。

【たからちゃんの話し方】
- 子どもの言葉をそのまま繰り返してから次の問いへ（受容→深掘り）
- 褒めるときは「えらい」より「気づいたね！」「おもしろい！」「そっか！」
- 間違いは否定せず「そう思うんだね、じゃあ〜はどう？」で転換する
- 「なんとなく」「わからない」も大切に受け取り、別の角度で聞き直す
- 絵文字は1つだけ使う
- 1回の返答は2文以内。問いは必ず1つだけ
- 答えを先に言わない。押しつけや説教はしない
- [${u.parentName}]に直接話しかけることは禁止。
  ただし4往復ごとのタイミングでは「${u.parentName}はどう思うか聞いてみて！」と
  子どもを通じて親に橋渡しする

【子どもの情報】
- 呼び方: ${u.name || 'きみ'}

【今回のお題】「${S.odai?.name}」
【レンズ】${S.lens}`;

  const ageLayers = {
    young:  `【ことばのルール：3〜5さい】\n- 全文ひらがな・カタカナのみ。漢字は使わない\n- 1文は15文字以内。短く、テンポよく\n- 抽象的な概念は使わず、五感で表現する`,
    middle: `【ことばのルール：6〜8さい】\n- 小学校1〜2年レベルの漢字まで使用可\n- 1文は25文字以内\n- 「なぜ？」「どう思う？」まで扱える`,
    older:  `【ことばのルール：9〜12さい】\n- 小学校全学年の漢字を使用可\n- 1文は40文字以内\n- 仮説・根拠・比較まで扱える`,
  };

  const lensLayers = {
    ことば:  `【ことばレンズ】フェーズ3では「これを一言で言うとしたら？」「まるで〇〇みたい、はどう？」オノマトペを一緒に作る。`,
    かず:    `【かずレンズ】フェーズ3では「どのくらいの大きさ？」「○○と比べると？」「いくつある？」パターンや規則性に気づかせる。`,
    かがく:  `【かがくレンズ】フェーズ3では「なんでそうなってると思う？」「もし〜だったらどうなる？」子どもの仮説を「実験したらわかるね！」と次の行動につなげる。`,
    しゃかい:`【しゃかいレンズ】フェーズ3では「だれがつくったんだろう？」「なんのためにあるの？」「これがなかった昔はどうしてたんだろう？」`,
    じぶん:  `【じぶんレンズ】フェーズ3では「好き？嫌い？なんで？」「前に似たような経験した？」「正解はないよ。きみはどう感じた？」`,
  };

  const phaseLayer = `【会話の4フェーズ — 必ずこの順番で進める】

■ フェーズ1「いまどこ？」（1往復）
  「どこで見つけたの？」「そのとき、まわりに何があった？」
  場所・状況が掴めたら即フェーズ2へ。

■ フェーズ2「よくみると？」（1往復）
  お題をじっくり観察させる。まだ「なぜ？」は聞かない。

■ フェーズ3「どう思う？」（1〜2往復）
  [レンズ]の方向で「なぜ？」を深掘り。子どもが「〜だと思う」と言えたら成功。

■ フェーズ4「まとめ」（フェーズ3完了後）
  「じゃあ、${S.odai?.name}ってひとことで言うとどういうもの？」と聞く。
  子どもの答えを受け取ったあと、必ず「📦」絵文字を使って「たからをしまおう！」と誘導する。
  例：「今日のたからをしまってみよう！📦」

【重要】フェーズは順番通りに進める。飛ばさない。戻らない。
現在の会話数: ${userMsgCount}回目
${parentDue ? `→ このタイミングで「${u.parentName}はどう思うか聞いてみて！」と子どもを通じて促すこと` : ''}`;

  const finalRules = `【最重要・必ず守る】
① 1回の返答で問うのは1つだけ
② 答えを先に言わない
③ 2文以内
④ フェーズ4でまとめを促すときは必ず「📦」を使う`;

  return [
    baseLayer,
    ageLayers[u.ageGroup] || ageLayers.young,
    lensLayers[S.lens]    || '',
    phaseLayer,
    finalRules,
  ].filter(Boolean).join('\n\n');
}

/* ── ai.js: summarySystem ── */
function summarySystem() {
  const conv = S.messages.map(m => {
    const who = m.role === 'ai' ? 'たからちゃん' : m.role === 'child' ? S.user.name || 'こども' : S.user.parentName;
    return `[${who}] ${m.text}`;
  }).join('\n');
  const maxChars    = S.user.ageGroup === 'young' ? 60 : S.user.ageGroup === 'middle' ? 100 : 150;
  const maxFindings = S.user.ageGroup === 'older' ? 3 : 2;

  return `あなたは「たからちゃん」です。以下の会話をもとにまとめを作ってください。

お題: ${S.odai?.name}　レンズ: ${S.lens}

【会話記録】
${conv}

【重要ルール】
- findingsは必ず上記の会話の中で実際に出た言葉・気づき・発見のみを使う
- 会話にない言葉の補完・推測・創作は禁止
- findingsは最大${maxFindings}個まで
- 子どもが自分の言葉で言った「答え」があれば、それを最初のfindingにする

【出力形式】JSONのみ（Markdownなし）:
{
  "findings": ["子どもが実際に言った言葉を活かした発見（1〜${maxFindings}個）"],
  "opinion": "保護者向けの温かいコメント。${maxChars}文字以内。2〜3段落。段落区切りは\\n。${S.user.ageGroup === 'young' ? 'ひらがな多め。' : ''}"
}`;
}

/* ═══════════════════════════════════════════════════════
   view.js（必要部分のみ）
   ═══════════════════════════════════════════════════════ */

/* ── チャットヘッダー ── */
function renderChatHeader() {
  const lens = LENSES.find(l => l.id === S.lens);
  return `
    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-header-emoji">${esc(S.odai?.emoji || '')}</span>
        <span class="chat-header-name">${esc(S.odai?.name || '')}</span>
        ${lens ? `<span class="chat-header-lens">${lens.icon} ${esc(lens.name)}</span>` : ''}
      </div>
      <button class="back-btn" onclick="App.closeChatFlow()">◀ もどる</button>
    </div>`;
}

/* ── オンボーディング ── */
function renderOnboard() {
  const s = S.step;
  const u = S.user;
  const dots = [0,1].map(i =>
    `<div class="step-dot ${i < s ? 'done' : i === s ? 'active' : ''}"></div>`
  ).join('');

  let body = '';
  if (s === 0) {
    body = `
      <div class="form-label">お子さんの <strong>よびかた</strong></div>
      <input class="form-input" id="ob-name" placeholder="れい：はるくん" value="${esc(u.name)}">
      <div class="form-error" id="ob-name-err">なまえをいれてください</div>
      <div class="form-label" style="margin-top:4px"><strong>ねんれい</strong>をえらんでね</div>
      <div class="age-cards">
        ${AGE_PROMPTS.map(a => `
          <div class="sel-card ${u.ageGroup === a.id ? 'selected' : ''}" onclick="App.setAge('${a.id}')">
            <span class="sel-card-icon">${a.icon}</span>
            <div><div class="sel-card-name">${a.label}</div><div class="sel-card-desc">${a.desc}</div></div>
          </div>`).join('')}
      </div>`;
  } else if (s === 1) {
    body = `
      <div class="form-label"><strong>いっしょにするひと</strong>のよびかた</div>
      <div class="parent-chips">
        ${PARENT_OPTS.map(p => `
          <div class="parent-chip ${u.parentName === p ? 'selected' : ''}" onclick="App.setParent('${esc(p)}')">${esc(p)}</div>`).join('')}
      </div>`;
  }

  return `
    <div style="padding:20px 16px;display:flex;flex-direction:column;flex:1">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:2.5rem;margin-bottom:8px">🔍</div>
        <div style="font-size:1.3rem;font-weight:bold;margin-bottom:4px">たから<em>さがし</em></div>
        <div style="font-size:0.8rem;color:#888">まいにちのふとした きづきが、まなびのたからになる</div>
      </div>
      <div class="step-dots">${dots}</div>
      ${body}
      <div style="margin-top:auto;padding-top:16px">
        <button class="btn-primary" onclick="App.obNext()">
          ${s < 1 ? 'つぎへ ›' : 'はじめる 🔍'}
        </button>
        ${s > 0 ? `<button class="btn-secondary" onclick="App.obBack()">← もどる</button>` : ''}
      </div>
    </div>`;
}

/* ── お題入力 ── */
function renderOdai() {
  const sampleChips = ODAI_SAMPLES.map(o => `
    <div class="odai-chip" onclick="App.selectOdaiSample(${JSON.stringify(JSON.stringify(o))})">${o.emoji} ${esc(o.name)}</div>
  `).join('');
  return `
    <div style="padding:20px 16px;display:flex;flex-direction:column;flex:1">
      <h2>📝 きょうのたからをきめよう</h2>
      <div class="form-label">気になるものや、さいきん見つけたものは？</div>
      <input class="form-input" id="odai-input" placeholder="れい：あり、くも、でんしゃ…">
      <div id="odai-error" class="form-error"></div>
      <div class="odai-hint">↓ サンプルからえらんでもOK</div>
      <div class="odai-list">${sampleChips}</div>
      <div style="margin-top:auto;padding-top:16px">
        <button class="btn-primary" onclick="App.submitOdai()">レンズをえらぶ ›</button>
        <button class="btn-secondary" onclick="App.closeChatFlow()">← もどる</button>
      </div>
    </div>`;
}

/* ── レンズ選択 ── */
function renderLens() {
  return `
    <div style="padding:20px 16px;display:flex;flex-direction:column;flex:1">
      <div class="odai-pill">
        <span>${esc(S.odai?.emoji || '')}</span>
        <span>${esc(S.odai?.name || '')}</span>
      </div>
      <div style="font-size:0.85rem;color:#888;margin-bottom:14px">どのレンズでみてみる？ひとつだけえらんでね 🔍</div>
      <div class="lens-grid">
        ${LENSES.map(l => `
          <div class="lens-card ${S.lens === l.id ? 'selected' : ''}" onclick="App.selectLens('${l.id}')">
            <div class="lens-card-top">
              <span class="lens-icon">${l.icon}</span>
              <div class="lens-name">${esc(l.name)}</div>
            </div>
            <div class="lens-desc">${esc(l.kidDesc)}</div>
          </div>`).join('')}
      </div>
      <div style="margin-top:auto;padding-top:8px">
        <button class="btn-primary" onclick="App.startChat()" ${!S.lens ? 'disabled' : ''}>
          ${!S.lens ? 'レンズをえらんでね' : `${LENSES.find(l=>l.id===S.lens)?.icon} ${esc(S.lens)}レンズではじめる ›`}
        </button>
        <button class="btn-secondary" onclick="App.backToOdai()">← おだいにもどる</button>
      </div>
    </div>`;
}

/* ── チャット画面 ── */
function renderChat() {
  const u = S.user;
  const isPhase4 = S.chatPhase >= 4;
  const phaseDots = [1,2,3,4].map(n => `
    <div class="phase-dot ${S.chatPhase > n ? 'done' : S.chatPhase === n ? 'active' : ''}"></div>
    ${n < 4 ? '<div class="phase-line"></div>' : ''}`).join('');

  return `
    ${renderChatHeader()}
    <div class="phase-bar">${phaseDots}</div>
    <div class="speaker-row">
      <div class="speaker-btn ${S.speaker === 'child'  ? 'active-child'  : ''}" onclick="App.setSpeaker('child')">👦 ${esc(u.name || 'こども')}</div>
      <div class="speaker-btn ${S.speaker === 'parent' ? 'active-parent' : ''}" onclick="App.setSpeaker('parent')">👨 ${esc(u.parentName)}</div>
    </div>
    <div class="chat-area" id="chat-area">
      ${S.messages.map(renderBubble).join('')}
      ${S.isLoading ? `
        <div class="bubble-ai">
          <div class="ai-avatar">🔍</div>
          <div class="bubble-ai-text">
            <div class="typing-dots"><span></span><span></span><span></span></div>
          </div>
        </div>` : ''}
      ${S.lastError ? `
        <div class="chat-error-row">
          ⚠️ つながらなかったよ
          <button class="retry-btn" onclick="App.retryLastSend()">もう一度</button>
        </div>` : ''}
    </div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-in"
        placeholder="${S.speaker === 'child' ? 'かんがえてみよう…' : esc(u.parentName) + 'もかんがえてみよう…'}"
        ${S.isLoading ? 'disabled' : ''}>
      <button class="chat-send" onclick="App.sendChat()" ${S.isLoading ? 'disabled' : ''}>➤</button>
    </div>
    ${isPhase4 ? `
      <button class="finish-btn" onclick="App.goSummary()">📦 たからをしまう</button>` : ''}`;
}

/* ── チャットバブル ── */
function renderBubble(m) {
  if (m.role === 'ai') return `
    <div class="bubble-ai">
      <div class="ai-avatar">🔍</div>
      <div class="bubble-ai-text">${aiText(m.text)}</div>
    </div>`;
  if (m.role === 'child') return `
    <div class="bubble-child"><div class="bubble-child-text">${esc(m.text)}</div></div>`;
  return `
    <div class="bubble-parent-wrap">
      <div class="bubble-parent-who">${esc(S.user.parentName)}</div>
      <div style="display:flex;justify-content:flex-end">
        <div class="bubble-parent-text">${esc(m.text)}</div>
      </div>
    </div>`;
}

/* ── サマリー ── */
function renderSummary() {
  const items = S.summaryItems;
  const paras = S.summaryOpinion.split(/\n/).filter(Boolean);
  const colors = ['#e8860a','#0a9396','#e76f51','#52b788','#9b89c4','#ffd166'];

  return `
    ${renderChatHeader()}
    <div style="flex:1;overflow-y:auto;padding:0 16px 20px">
      <div class="summary-hero">
        <span class="summary-hero-emoji">${esc(S.odai?.emoji || '🔍')}</span>
        <div class="summary-hero-ttl">たからみつかった！</div>
        <div class="summary-hero-sub">${esc(S.odai?.name || '')} · ${esc(S.lens || '')}レンズ</div>
      </div>

      <!-- きょうのたから -->
      <div class="findings-card">
        <div class="findings-label">✨ きょうみつけたたから</div>
        ${items.length === 0
          ? `<div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:#aaa">
               <span class="spinner"></span>まとめているよ…
             </div>`
          : items.map((f, i) => `
              <div class="finding-item">
                <div class="finding-dot" style="background:${colors[i % colors.length]}"></div>
                <div class="finding-text">${esc(f)}</div>
              </div>`).join('')}
      </div>

      <!-- AIのかんがえ -->
      <div class="ai-opinion-card">
        <div class="ai-opinion-toggle" onclick="App.toggleOpinion()">
          <div class="ai-opinion-label">💡 AIのかんがえ（おとな向け）</div>
          <div>▾</div>
        </div>
        <div class="ai-opinion-body" style="display:${S.opinionOpen ? 'block' : 'none'}">
          ${paras.length > 0
            ? paras.map(p => `<div class="ai-opinion-para">${esc(p)}</div>`).join('')
            : `<div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:#aaa">
                 <span class="spinner"></span>よみこみちゅう…
               </div>`}
        </div>
      </div>

      <!-- あしたやってみよう！ -->
      <div class="tomorrow-card">
        <div class="tomorrow-label">🌱 あしたやってみよう！</div>
        ${!S.tomorrowHint
          ? `<div class="tomorrow-loading"><span class="spinner"></span><span>かんがえているよ…</span></div>`
          : `<div class="tomorrow-text">${esc(S.tomorrowHint)}</div>`}
      </div>

      <!-- きろくノート -->
      <div class="note-card">
        <div class="note-label">📓 きろくノート</div>
        <div style="font-size:0.78rem;color:#aaa;margin-bottom:6px">きょうきづいたこと、おもったことをかいてみよう</div>
        <textarea class="note-textarea" id="note-input" placeholder="（じゆうにかいてね）">${esc(S.currentNote)}</textarea>
        <button class="note-save-btn" onclick="App.saveNote()">💾 ほぞんする</button>
      </div>

      <!-- アクションボタン -->
      <div class="summary-action-row">
        <button class="summary-action-btn summary-action-again" onclick="App.doAgain()">
          <span>🔄</span><span>べつのレンズで</span>
        </button>
        <button class="summary-action-btn summary-action-next" onclick="App.nextOdai()">
          <span>✨</span><span>つぎのおだい</span>
        </button>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   app.js（必要部分のみ）
   ═══════════════════════════════════════════════════════ */

function render() {
  const root = $id('screen-root');
  root.style.display = 'flex';
  root.style.flexDirection = 'column';
  root.style.flex = '1';

  if (S.flow === 'onboard') {
    root.innerHTML = renderOnboard();
  } else if (S.flow === 'odai') {
    root.innerHTML = renderOdai();
  } else if (S.flow === 'lens') {
    root.innerHTML = renderLens();
  } else if (S.flow === 'chat') {
    root.innerHTML = renderChat();
    bindChatEvents();
    scrollChat();
  } else if (S.flow === 'summary') {
    root.innerHTML = renderSummary();
  }
}

function bindChatEvents() {
  const ci = $id('chat-in');
  if (ci) {
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); App.sendChat(); }
    });
  }
}

function scrollChat() {
  setTimeout(() => {
    const el = $id('chat-area');
    if (el) el.scrollTop = el.scrollHeight;
  }, 80);
}

const App = {

  /* ── オンボーディング ── */
  obNext() {
    const s = S.step;
    if (s === 0) {
      const name = $id('ob-name')?.value?.trim();
      if (!name) {
        $id('ob-name-err')?.classList.add('show');
        return;
      }
      S.user.name  = name;
    }
    if (s < 1) {
      S.step++;
      render();
    } else {
      // 完了 → お題入力へ
      S.flow = 'odai';
      render();
    }
  },
  obBack() {
    if (S.step > 0) { S.step--; render(); }
  },
  setAge(a)    { S.user.ageGroup  = a; render(); },
  setParent(p) { S.user.parentName = p; render(); },

  /* ── お題 ── */
  selectOdaiSample(jsonStr) {
    const o = JSON.parse(jsonStr);
    S.odai = o;
    S.lens = S.lastLens || null;
    S.flow = 'lens';
    render();
  },
  async submitOdai() {
    const txt = $id('odai-input')?.value?.trim();
    const errEl = $id('odai-error');
    if (!txt) {
      errEl.textContent = 'おだいをいれてください';
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    // AIでお題オブジェクト化を試みる（失敗したら直接使う）
    try {
      const res = await callAI(
        [{ role:'user', content:`子どもが「${txt}」と言いました。JSONのみ: {"name":"ひらがな短い単語","emoji":"絵文字","label":"カテゴリ"}` }],
        'JSONのみ返してください（Markdownなし）。'
      );
      S.odai = JSON.parse(res.replace(/```json|```/g, '').trim());
    } catch {
      S.odai = { emoji:'✨', name: txt.slice(0, 10), label:'きになること' };
    }
    S.lens = S.lastLens || null;
    S.flow = 'lens';
    render();
  },
  backToOdai() { S.flow = 'odai'; render(); },
  closeChatFlow() { S.flow = 'odai'; render(); },

  /* ── レンズ ── */
  selectLens(id) {
    S.lens = S.lens === id ? null : id;
    render();
  },

  /* ── チャット開始（app.js: startChat と同一） ── */
  async startChat() {
    if (!S.lens) return;
    S.messages  = [];
    S.flow      = 'chat';
    S.isLoading = true;
    S.lastError = false;
    S.chatPhase = 1;
    S.lastLens  = S.lens;
    S.speaker   = 'child';
    render();

    const hour      = new Date().getHours();
    const timeOfDay = hour < 11 ? 'あさ' : hour < 17 ? 'ひるま' : 'よる';
    const startMsg  = `${timeOfDay}です。フェーズ1から始めてください。最初の問いかけを1つだけ。`;

    try {
      const text = await callAI([{ role:'user', content: startMsg }], chatSystem());
      S.messages.push({ role:'ai', text });
    } catch(err) {
      console.error('chat start error:', err);
      S.messages.push({ role:'ai', text: `${S.odai?.name}、どこでみつけたの？🔍` });
    }
    S.isLoading = false;
    render();
    scrollChat();
  },

  setSpeaker(sp) { S.speaker = sp; render(); },

  /* ── メッセージ送信（app.js: sendChat と同一） ── */
  async sendChat() {
    const inp = $id('chat-in');
    const txt = inp?.value?.trim();
    if (!txt || S.isLoading) return;

    const sentAs = S.speaker;
    S.messages.push({ role: sentAs, text: txt });
    S.speaker   = 'child';
    S.isLoading = true;
    S.lastError = false;
    if (inp) inp.value = '';
    render();
    scrollChat();

    const payload      = App._buildApiMsgs();
    S.lastSendPayload  = payload;
    const userMsgCount = S.messages.filter(m => m.role !== 'ai').length;

    try {
      const text = await callAI(payload, chatSystem());
      S.messages.push({ role:'ai', text });
      S.lastError = false;

      const detected = detectPhaseFromAI(text, userMsgCount);
      if (detected && detected > S.chatPhase) {
        S.chatPhase = detected;
      } else if (!detected) {
        if (userMsgCount >= 1 && S.chatPhase < 2) S.chatPhase = 2;
        if (userMsgCount >= 3 && S.chatPhase < 3) S.chatPhase = 3;
      }
    } catch(err) {
      console.error('chat error:', err);
      S.lastError = true;
    }
    S.isLoading = false;
    render();
    scrollChat();
  },

  async retryLastSend() {
    if (!S.lastSendPayload || S.isLoading) return;
    S.isLoading = true; S.lastError = false;
    render(); scrollChat();
    try {
      const text = await callAI(S.lastSendPayload, chatSystem());
      S.messages.push({ role:'ai', text });
      S.lastError = false;
    } catch {
      S.lastError = true;
    }
    S.isLoading = false;
    render();
    scrollChat();
  },

  /* ── app.js: _buildApiMsgs と同一 ── */
  _buildApiMsgs() {
    const apiMsgs = [];
    for (const m of S.messages) {
      if (m.role === 'ai') {
        apiMsgs.push({ role:'assistant', content: m.text });
      } else {
        const label = m.role === 'child' ? S.user.name || 'こども' : S.user.parentName;
        apiMsgs.push({ role:'user', content: `[${label}] ${m.text}` });
      }
    }
    if (apiMsgs[0]?.role === 'assistant') {
      apiMsgs.unshift({ role:'user', content:'はじめてください' });
    }
    return apiMsgs;
  },

  /* ── サマリー（app.js: goSummary と同一） ── */
  async goSummary() {
    S.flow           = 'summary';
    S.summaryItems   = [];
    S.summaryOpinion = '';
    S.opinionOpen    = false;
    S.bookmarked     = false;
    S.currentNote    = '';
    S.tomorrowHint   = '';
    render();

    try {
      const res  = await callAI([{ role:'user', content:'まとめてください。' }], summarySystem());
      const data = JSON.parse(res.replace(/```json|```/g, '').trim());
      S.summaryItems   = data.findings || [];
      S.summaryOpinion = data.opinion  || '';
    } catch(err) {
      console.error('summary error:', err);
      S.summaryItems   = ['いっぱいかんがえた！'];
      S.summaryOpinion = 'ふたりとも、すごいはっけんだったね！';
    }
    render();

    // あしたやってみよう！を非同期で生成
    App._generateTomorrowHint();
  },

  /* ── app.js: _generateTomorrowHint と同一 ── */
  async _generateTomorrowHint() {
    if (S.tomorrowHint) return;
    try {
      const odaiName    = S.odai?.name  || '';
      const lensName    = S.lens        || '';
      const findingsTxt = (S.summaryItems || []).join('、');
      const prompt = `子ども向けアプリで、お題「${odaiName}」をレンズ「${lensName}」で探索し、「${findingsTxt}」を発見しました。明日の日常で意識できることを、子ども（3〜9歳）向けに1文でやさしく提案してください。JSONのみ: {"hint":"ひらがな・ことばあそびで1文"}`;
      const res = await callAI(
        [{ role:'user', content: prompt }],
        'JSONのみ返してください（Markdownなし）。子どもが実践できる具体的な行動を1文で。'
      );
      const data = JSON.parse(res.replace(/```json|```/g, '').trim());
      S.tomorrowHint = data.hint || '';
    } catch(err) {
      console.error('tomorrowHint error:', err);
      S.tomorrowHint = 'あしたも、まわりのものをじっくりみてみよう！';
    }
    render();
  },

  toggleOpinion() { S.opinionOpen = !S.opinionOpen; render(); },

  saveNote() {
    const txt = $id('note-input')?.value?.trim() || '';
    S.currentNote = txt;
    const btn = document.querySelector('.note-save-btn');
    if (btn) {
      btn.textContent = '✓ ほぞんしたよ！';
      setTimeout(() => { btn.textContent = '💾 ほぞんする'; }, 1500);
    }
  },

  doAgain() {
    // 同じお題・別レンズ
    S.flow      = 'lens';
    S.lens      = null;
    S.messages  = [];
    S.chatPhase = 1;
    render();
  },

  nextOdai() {
    S.flow      = 'odai';
    S.odai      = null;
    S.lens      = null;
    S.messages  = [];
    S.chatPhase = 1;
    render();
  },
};

/* ── 起動 ── */
render();
</script>
</body>
</html>
